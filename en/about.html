    </a>
    <div class="banner-nav">
      <a href="/en/about" class="active">About</a>
      <a href="/en/projects">Projects</a>
      <a href="/en/next">Next</a>
      <a href="/en/contact">Contact</a>
      <a class="banner-ig" href="https://instagram.com/aurionzen" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
        <span>@aurionzen</span>
      </a>
      <span class="nav-ind" id="navInd"></span>
    </div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mobile-overlay" id="mobileOverlay"></div>
  <div class="mobile-menu" id="mobileMenu">
    <a href="/en/about" class="active">About</a>
    <a href="/en/projects">Projects</a>
    <a href="/en/next">Next</a>
    <a href="/en/contact">Contact</a>
  </div>
  <div class="page">
    <h1 class="page-title reveal">About</h1>
    <p class="page-desc reveal">We won't pretend we're not nosy. But at least we're not here for your money — just trying to make things right. That's all.</p>
  </div>
<footer>
    <div class="footer-inner">
      <div class="footer-left">
        <span>&copy; 2026 Aurion</span>
      </div>
      <div class="footer-version">v:-1</div>
      <div class="footer-links">
        <a href="/en/about">About</a>
        <a href="/en/projects">Projects</a>
        <a href="/en/next">Next</a>
        <a href="/en/contact">Contact</a>
      </div>
    </div>
  </footer>
</div>
<div class="transition-overlay" id="transOverlay"></div>
<div class="transition-cloud" id="transCloud">
  <div class="cloud-wall cloud-wall-left">
    <img class="cloud-img ci-1" data-cloud alt="" draggable="false">
    <img class="cloud-img ci-2" data-cloud alt="" draggable="false">
    <img class="cloud-img ci-7" data-cloud alt="" draggable="false">
    <img class="cloud-img ci-3" data-cloud alt="" draggable="false">
    <img class="cloud-img ci-9" data-cloud alt="" draggable="false">
  </div>
  <div class="cloud-wall cloud-wall-right">
    <img class="cloud-img ci-4" data-cloud alt="" draggable="false">
    <img class="cloud-img ci-5" data-cloud alt="" draggable="false">
    <img class="cloud-img ci-8" data-cloud alt="" draggable="false">
    <img class="cloud-img ci-6" data-cloud alt="" draggable="false">
    <img class="cloud-img ci-10" data-cloud alt="" draggable="false">
  </div>
</div>
<script>
  function siteBanner() { return document.getElementById('banner'); }
  let ticking = false;
  function getBrightness(el) {
    if (!el || el === document.body || el === document.documentElement) return 255;
    const bg = getComputedStyle(el).backgroundColor;
    if (!bg || bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') return getBrightness(el.parentElement);
    const m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (!m) return getBrightness(el.parentElement);
    return (parseInt(m[1]) * 299 + parseInt(m[2]) * 587 + parseInt(m[3]) * 114) / 1000;
  }
  function updateBanner() {
    const b = siteBanner();
    if (!b) { ticking = false; return; }
    const rect = b.getBoundingClientRect();
    const target = document.elementFromPoint(window.innerWidth / 2, rect.bottom + 1);
    b.classList.toggle('dark', getBrightness(target) < 128);
    ticking = false;
  }
  function initHome() {
    const hc = document.querySelector('.home-center');
    if (hc && !hc.dataset.crtInit) { hc.dataset.crtInit = '1'; setTimeout(() => hc.classList.add('crt-active'), 1400); }
  }
  function initPage() { updateBanner(); initHome(); initHomeEditable(); updateTiming(); scatterClouds(); initFooterReveal(); initMobileMenu(); initReveal(); initSpot(); initNavInd(); }
  function navLinks() { const n = document.querySelector('.banner-nav'); return n ? Array.from(n.querySelectorAll('a:not(.banner-ig)')) : []; }
  function moveNavInd(link) {
    const ind = document.getElementById('navInd');
    if (!ind) return;
    if (!link) { ind.style.opacity = '0'; return; }
    ind.style.opacity = '1';
    ind.style.left = link.offsetLeft + 'px';
    ind.style.width = link.offsetWidth + 'px';
    ind.style.top = (link.offsetTop + link.offsetHeight - 3) + 'px';
  }
  function initNavInd() {
    const nav = document.querySelector('.banner-nav');
    if (!nav || nav.dataset.indInit) { syncNavInd(); return; }
    nav.dataset.indInit = '1';
    navLinks().forEach(a => {
      a.addEventListener('mouseenter', () => moveNavInd(a));
    });
    nav.querySelectorAll('.banner-ig').forEach(b => {
      b.addEventListener('mouseenter', () => moveNavInd(null));
      b.addEventListener('mouseleave', syncNavInd);
    });
    nav.addEventListener('mouseleave', syncNavInd);
    syncNavInd();
  }
  function syncNavInd() {
    const links = navLinks();
    moveNavInd(links.find(a => a.classList.contains('active')) || null);
  }
  function initSpot() {
    document.querySelectorAll('.banner-ig').forEach(b => {
      b.onmousemove = (e) => {
        const r = b.getBoundingClientRect();
        b.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
        b.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
      };
    });
  }
  let _revObs = null;
  function initReveal() {
    if (_revObs) _revObs.disconnect();
    const els = document.querySelectorAll('#site .reveal');
    if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
    _revObs = new IntersectionObserver((entries) => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); _revObs.unobserve(en.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach(el => _revObs.observe(el));
  }
  function initMobileMenu() {
    const btn = document.getElementById('hamburgerBtn');
    const menu = document.getElementById('mobileMenu');
    const overlay = document.getElementById('mobileOverlay');
    if (!btn || !menu || !overlay) return;
    btn.onclick = function() {
      btn.classList.toggle('open');
      menu.classList.toggle('open');
      overlay.classList.toggle('open');
    };
    overlay.onclick = function() {
      btn.classList.remove('open');
      menu.classList.remove('open');
      overlay.classList.remove('open');
    };
    menu.querySelectorAll('a').forEach(function(a) {
      a.onclick = function() {
        btn.classList.remove('open');
        menu.classList.remove('open');
        overlay.classList.remove('open');
      };
    });
  }
  function initFooterReveal() {
    const footer = document.querySelector('footer');
    if (!footer) return;
    footer.classList.remove('visible');
    function onWheel(e) {
      const maxScroll = document.body.scrollHeight - window.innerHeight;
      const atBottom = window.scrollY >= maxScroll - 5;
      if (e.deltaY > 0 && atBottom) footer.classList.add('visible');
      else if (e.deltaY < 0) footer.classList.remove('visible');
    }
    window.removeEventListener('wheel', window._footerWheel);
    window._footerWheel = onWheel;
    window.addEventListener('wheel', onWheel, { passive: true });
  }
  function scatterClouds() {
    if (window._cloudScatter) return;
    window._cloudScatter = true;
    const rnd = (a, b) => a + Math.random() * (b - a);
    document.querySelectorAll('.cloud-img').forEach(img => {
      const cs = getComputedStyle(img);
      if (cs.display === 'none') return;
      const wall = img.parentElement;
      const ww = wall.clientWidth || 1, wh = wall.clientHeight || 1;
      if (cs.bottom === 'auto') {
        img.style.top = (parseFloat(cs.top) + rnd(-0.01, 0.01) * wh) + 'px';
      }
      if (cs.left !== 'auto') {
        img.style.left = (parseFloat(cs.left) + rnd(-0.02, 0.02) * ww) + 'px';
      } else if (cs.right !== 'auto') {
        img.style.right = (parseFloat(cs.right) + rnd(-0.02, 0.02) * ww) + 'px';
      }
      img.style.opacity = rnd(0.88, 1).toFixed(3);
    });
  }
  function cloudTravel() {
    return matchMedia('(max-aspect-ratio: 1/1)').matches ? 235 : 152;
  }
  function cloudDuration() {
    return Math.min(2000, Math.max(900, Math.round(cloudTravel() / 130 * 1000)));
  }
  function fadeDuration() {
    const ar = window.innerWidth / Math.max(1, window.innerHeight);
    return Math.min(1200, Math.max(700, Math.round(450 * ar)));
  }
  function updateTiming() {
    document.documentElement.style.setProperty('--slideDur', cloudDuration() + 'ms');
    document.documentElement.style.setProperty('--fadeDur', fadeDuration() + 'ms');
    syncNavInd();
  }
  window.addEventListener('resize', updateTiming);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => syncNavInd());
  // note: no mousemove blur — empty edit screen persists until mouseleave / click-outside
  function initHomeEditable() {
    const el = document.querySelector('.editable-home');
    if (!el || el.dataset.homeInit) return;
    el.dataset.homeInit = '1';
    const def = el.dataset.default;
    const hover = el.dataset.hover;
    let swapTimer = null;
    let typed = null;
    let refocusSpent = false;
    function cancelSwap() { if (swapTimer) { clearTimeout(swapTimer); swapTimer = null; } el.style.filter = ''; }
    function animateTo(text) {
      if (el.textContent === text && !swapTimer) { cancelSwap(); return; }
      cancelSwap();
      el.style.transition = 'filter .2s ease';
      el.style.filter = 'blur(8px)';
      swapTimer = setTimeout(() => { el.textContent = text; el.style.filter = 'blur(0)'; swapTimer = null; }, 200);
    }
    let leaveTimer = null;
    function cancelLeave() { if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; } }
    el.addEventListener('mouseenter', () => {
      cancelLeave();
      if (document.activeElement === el) return;
      cancelSwap();
      animateTo(typed !== null ? typed : hover);
    });
    el.addEventListener('mouseleave', () => {
      cancelSwap();
      cancelLeave();
      leaveTimer = setTimeout(() => {
        leaveTimer = null;
        if (document.activeElement === el) return;
        if (el.matches(':hover')) return;
        typed = null;
        animateTo(def);
      }, 180);
    });
    el.addEventListener('focus', () => {
      cancelSwap();
      cancelLeave();
      refocusSpent = false;
      const cur = el.textContent;
      if (cur === def || cur === hover) el.textContent = '';
    });

    el.addEventListener('input', () => { refocusSpent = true; const v = el.textContent.trim(); typed = v || null; });
    el.addEventListener('blur', () => {
      cancelSwap();
      const v = el.textContent.trim();
      if (!v || v === def) {
        if (el.matches(':hover')) {
          if (!v && !refocusSpent) { refocusSpent = true; el.focus({ preventScroll: true }); }
          return;
        }
        typed = null; animateTo(def);
      }
    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Tab') refocusSpent = true;
      if (e.key === 'Enter') {
        e.preventDefault();
        if (el.textContent.trim() === 'Why?') {
          el.blur();
          if (typeof pjaxGo === 'function') pjaxGo('/en/easter', true);
          else window.location.href = '/en/easter';
        }
      }
    });
  }
  window.addEventListener('scroll', () => { if (!ticking) { requestAnimationFrame(updateBanner); ticking = true; } }, { passive: true });
  window.addEventListener('resize', () => { if (!ticking) { requestAnimationFrame(updateBanner); ticking = true; } }, { passive: true });
  updateBanner();

  const overlay = document.getElementById('transOverlay');
  const cloud = document.getElementById('transCloud');
  const pageLoad = document.getElementById('pageLoad');

  function clearPageLoad() { if (pageLoad && !pageLoad.classList.contains('clear')) pageLoad.classList.add('clear'); }
  function coverOn() { overlay.classList.add('active'); cloud.classList.add('active'); }
  function coverOff() { cloud.classList.remove('active'); overlay.classList.remove('active'); }
   function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
   let _cloudP = null, _cloudSrcNow = '';
   function cloudSrc() { return (window.innerWidth / Math.max(1, window.innerHeight)) < 1.1 ? '/en/cloud-low.webp' : '/en/cloud-main.png'; }
   function cloudReady() {
     const want = cloudSrc();
     let dirty = (_cloudSrcNow !== want);
     _cloudSrcNow = want;
     document.querySelectorAll('img[data-cloud]').forEach((im) => {
       if (im.getAttribute('src') !== want) { im.setAttribute('src', want); dirty = true; }
     });
     if (!dirty && _cloudP) return _cloudP;
     const tc = document.getElementById('transCloud'), pl = document.getElementById('pageLoad');
     if (tc) tc.classList.remove('ready');
     if (pl) pl.classList.remove('ready');
     _cloudP = new Promise((res) => {
       const imgs = Array.from(document.querySelectorAll('img[data-cloud]'));
       let n = imgs.length;
       if (!n) { res(); return; }
       const done = () => {
         if (--n <= 0) {
           if (tc) tc.classList.add('ready');
           if (pl) pl.classList.add('ready');
           res();
         }
       };
       imgs.forEach((im) => {
         const fin = () => { if (im.decode) { im.decode().then(done).catch(done); } else done(); };
         if (im.complete && im.naturalWidth > 0) fin();
         else { im.onload = fin; im.onerror = done; }
       });
     });
     return _cloudP;
   }
   let _rzT = null;
   window.addEventListener('resize', () => { clearTimeout(_rzT); _rzT = setTimeout(() => { if (cloudSrc() !== _cloudSrcNow) cloudReady(); }, 250); });
   window.addEventListener('load', () => { cloudReady().then(() => setTimeout(clearPageLoad, 700)); initPage(); });
   cloudReady().then(() => setTimeout(clearPageLoad, 2500));
   setTimeout(clearPageLoad, 5000);
  initPage();

   async function pjaxGo(href, push) {
     await cloudReady();
     coverOn();
    await wait(cloudDuration());
    let html = null;
    try {
      const res = await fetch(href, { headers: { 'X-PJAX': '1' } });
      if (!res.ok) throw new Error('bad');
      html = await res.text();
    } catch (e) { window.location.href = href; return; }
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const fresh = doc.getElementById('site');
    if (!fresh) { window.location.href = href; return; }
    document.getElementById('site').innerHTML = fresh.innerHTML;
    const t = doc.querySelector('title');
    if (t) document.title = t.textContent;
    if (push) history.pushState({ pjax: 1 }, '', href);
    window.scrollTo(0, 0);
    initPage();
    requestAnimationFrame(() => requestAnimationFrame(coverOff));
  }

  document.addEventListener('click', (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    const a = e.target.closest ? e.target.closest('a') : null;
    if (!a) return;
    const href = a.getAttribute('href');
    if (!href || href.charAt(0) !== '/') return;
    e.preventDefault();
    pjaxGo(href, true);
  });
  window.addEventListener('popstate', () => { pjaxGo(location.pathname, false); });
</script>
